# `make db` starts Postgres only. `make up` also runs the app from its production
# images (profile "app") behind a gateway on http://localhost:8080.

x-backend: &backend
  build: ./backend
  image: kubute-backend
  env_file: backend/.env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    FORWARDED_ALLOW_IPS: "*"
  profiles: [app]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kubute}
      POSTGRES_USER: ${POSTGRES_USER:-kubute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kubute}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off, like the migrate Job in Kubernetes.
  migrate:
    <<: *backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    image: kubute-frontend
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    profiles: [app]

  # Local stand-in for the cluster Gateway: same routes, one origin.
  gateway:
    build: ./gateway
    image: kubute-gateway
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - frontend
    profiles: [app]

volumes:
  postgres-data:
